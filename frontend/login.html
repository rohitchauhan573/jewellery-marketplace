<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Jewellery Wala</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Jewellery Wala</a>
    <span class="tagline">Jewellery from trusted local shops</span>
    <nav id="nav" class="nav"></nav>
  </header>

  <main class="container narrow">
    <section class="panel">
      <h1>Login</h1>
      <form id="login-form" class="form">
        <label>Email <input id="email" type="email" required autocomplete="email"></label>
        <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
        <p id="msg" class="notice" hidden></p>
        <button id="submit" type="submit">Login</button>
      </form>
      <p class="note">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <footer class="site-footer">Jewellery Wala project demo</footer>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
