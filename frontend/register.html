<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - JewelHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">JewelHub</a>
    <span class="tagline">Jewellery from trusted local shops</span>
    <nav id="nav" class="nav"></nav>
  </header>

  <main class="container narrow">
    <section class="panel">
      <h1>Create an account</h1>
      <form id="register-form" class="form">
        <label>Full name <input id="name" required autocomplete="name"></label>
        <label>Email <input id="email" type="email" required autocomplete="email"></label>
        <label>Password (at least 6 characters)
          <input id="password" type="password" minlength="6" required autocomplete="new-password">
        </label>
        <label>I want to
          <select id="role">
            <option value="customer">Buy jewellery (customer)</option>
            <option value="shop_owner">Sell jewellery (shop owner)</option>
          </select>
        </label>
        <p id="msg" class="notice" hidden></p>
        <button id="submit" type="submit">Register</button>
      </form>
      <p class="note">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <footer class="site-footer">JewelHub project demo</footer>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
