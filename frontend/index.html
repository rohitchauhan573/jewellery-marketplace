<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewellery Wala - Jewellery Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Jewellery Wala</a>
    <span class="tagline">Jewellery from trusted local shops</span>
    <nav id="nav" class="nav"></nav>
  </header>

  <main class="container">
    <h1 id="page-title">All jewellery</h1>
    <section id="chips" class="chips"></section>

    <section class="filters">
      <input id="q" type="search" placeholder="Search jewellery...">
      <select id="category"><option value="">All categories</option></select>
      <select id="purity">
        <option value="">Any purity</option>
        <option value="24K">24K</option>
        <option value="22K">22K</option>
        <option value="18K">18K</option>
      </select>
      <select id="gender">
        <option value="">Everyone</option>
        <option value="women">Women</option>
        <option value="men">Men</option>
        <option value="unisex">Unisex</option>
      </select>
      <input id="min_price" type="number" min="0" placeholder="Min price">
      <input id="max_price" type="number" min="0" placeholder="Max price">
      <button id="apply" type="button">Apply</button>
      <button id="reset" type="button" class="secondary">Reset</button>
    </section>

    <p id="status" class="status"></p>
    <section id="grid" class="grid"></section>
  </main>

  <footer class="site-footer">Jewellery Wala project demo</footer>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
